# Shared exercise link opened BEFORE sign-up (run after: simctl openurl … gymfreak://exercise/barbell-bench-press?ref=$REF).
# Checks: the referral code is prefilled from the link, attribution is claimed at sign-up (PENDING only),
# the destination survives onboarding/auth, the premium lock + 100% coupon unlock, and the unavailable state.
appId: com.gymfreak.app
env:
  PASSWORD: CorrectHorse2026!
---
- runFlow: accept-open-prompt.yaml                                    # iOS: “Open in Gym Freak?” for the shared link
- extendedWaitUntil: { visible: "Training Built Around You", timeout: 60000 }
- tapOn: "Next"                                        # intro slides
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Let’s Go"
- extendedWaitUntil: { visible: "Choose Your Language", timeout: 20000 }
- tapOn: "Continue in.*"                               # language
- takeScreenshot: 01-onboarding-goal
- tapOn: "Build Muscle"
- tapOn: "That’s My Goal"
- tapOn: "Beginner"
- tapOn: "Continue"
- tapOn: "Gym"
- tapOn: "Continue"
- tapOn: "Set My Week"
- tapOn: "30-45 min"
- tapOn: "Continue"                                    # duration
- tapOn: "Dumbbells"
- tapOn: "Barbell"
- tapOn: "Bench"
- tapOn: "Continue"                                    # equipment
- takeScreenshot: 02-onboarding-age
- tapOn: "Continue"                                    # age (default value)
- tapOn: { text: "Skip", optional: true }              # height
- tapOn: { text: "Skip", optional: true }              # weight
- tapOn: "Prefer not to say"
- tapOn: "Build My Plan"
- takeScreenshot: 03-sign-up
- tapOn: { id: "auth-first-name" }
- inputText: "Maestro"
- hideKeyboard                                   # Android only exposes on-screen fields
- tapOn: { id: "auth-email" }
- inputText: ${EMAIL}
- hideKeyboard                                   # the keyboard covers the lower fields
# Reveal the password fields first: XCTest can't type into iOS secure fields reliably.
- tapOn: { id: "auth-password-reveal" }
- tapOn: { id: "auth-confirm-password-reveal" }
- tapOn: { id: "auth-password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "auth-confirm-password" }
- inputText: ${PASSWORD}
- runFlow:                                       # dismiss the keyboard: iOS via a static title, Android via back
    when: { platform: iOS }
    commands:
      - tapOn: "Create your account"
- runFlow:
    when: { platform: Android }
    commands:
      - hideKeyboard
- scrollUntilVisible: { element: { id: "auth-referral" }, direction: DOWN, visibilityPercentage: 50 }
- assertVisible: "Added from your invite link"                       # prefilled from the shared link
- takeScreenshot: g01-signup-referral-prefilled
- tapOn: "Create Account"
- tapOn: { text: "I’ll do this later", optional: true }
- extendedWaitUntil: { visible: "Let’s Go", timeout: 30000 }
- tapOn: "Let’s Go"
- runFlow:                                                            # stay on the free plan (no trial)
    when: { visible: "Continue with free plan" }
    commands:
      - tapOn: "Continue with free plan"
# The shared exercise opens as soon as the signed-in app is ready.
- extendedWaitUntil: { visible: "Barbell Bench Press", timeout: 30000 }
- assertVisible: "Share Exercise"
- takeScreenshot: g02-shared-free-exercise
- tapOn: "Share Exercise"
- extendedWaitUntil: { visible: "never-shown-marker", timeout: 2500, optional: true }
- takeScreenshot: g03-native-share-sheet
- runFlow:                                             # iOS share sheet: swipe it away (no Close button on iOS 26)
    when: { platform: iOS }
    commands:
      - swipe: { start: "50%,62%", end: "50%,99%", duration: 300 }
      - extendedWaitUntil: { visible: "never-shown-marker", timeout: 1200, optional: true }
- runFlow:
    when: { platform: Android }
    commands:
      - back
# Premium exercise for a free account: lock, then unlock with a 100% coupon (no charge).
- openLink: "gymfreak://exercise/back-squat?ref=${REF}"
- extendedWaitUntil: { visible: "never-shown-marker", timeout: 1500, optional: true }
- runFlow: accept-open-prompt.yaml
- extendedWaitUntil: { visible: "Premium Exercise", timeout: 20000 }
- scrollUntilVisible: { element: { text: "This exercise is available with Gym Freak Pro." }, direction: DOWN, visibilityPercentage: 100 }
- takeScreenshot: g04-premium-locked
- scrollUntilVisible: { element: { text: "Unlock with Gym Freak Pro" }, direction: DOWN, visibilityPercentage: 50 }
- tapOn: "Unlock with Gym Freak Pro"
- extendedWaitUntil: { visible: "HAVE A COUPON\\?", timeout: 20000 }
- scrollUntilVisible: { element: { id: "coupon-input" }, direction: DOWN, visibilityPercentage: 100 }
- scroll
- tapOn: { id: "coupon-input" }
- inputText: "launchfree"
- tapOn: "Apply"
- extendedWaitUntil: { visible: "Coupon applied", timeout: 15000 }
- assertVisible: "Free"
- takeScreenshot: g05-coupon-applied-free
- tapOn: "Activate free access"
- extendedWaitUntil: { visible: "How To Perform", timeout: 30000 }             # back on the same exercise, unlocked
- assertNotVisible: "Premium Exercise"
- takeScreenshot: g06-premium-unlocked
# Deleted / unknown exercise
- openLink: "gymfreak://exercise/no-such-exercise-zz"
- extendedWaitUntil: { visible: "never-shown-marker", timeout: 1500, optional: true }
- runFlow: accept-open-prompt.yaml
- extendedWaitUntil: { visible: "Exercise unavailable", timeout: 20000 }
- takeScreenshot: g07-unavailable
- tapOn: "Explore Exercises"
- extendedWaitUntil: { visible: "Explore", timeout: 10000 }
