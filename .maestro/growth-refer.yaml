# Refer & Earn for the signed-in account: code, copy confirmation, native share sheet, server stats.
appId: com.gymfreak.app
---
- runFlow: launch-app.yaml
- extendedWaitUntil: { visible: "Ready to crush your workout\\?", timeout: 30000 }
- tapOn: { text: "Profile", index: 0 }
- extendedWaitUntil: { visible: "SUBSCRIPTION", timeout: 6000, optional: true }
- runFlow: { when: { notVisible: "SUBSCRIPTION" }, commands: [ { tapOn: { text: "Profile", index: 0 } } ] }
- scrollUntilVisible: { element: { text: ".*Refer & Earn.*" }, direction: DOWN, visibilityPercentage: 50 }
- tapOn: ".*Refer & Earn.*"
- extendedWaitUntil: { visible: "YOUR REFERRAL CODE", timeout: 15000 }
- assertVisible: ".*Successful referrals.*"
- assertVisible: ".*Pending referrals.*"
- takeScreenshot: r01-refer-earn
- tapOn: "Copy Code"
- extendedWaitUntil: { visible: "Copied", timeout: 5000 }
- takeScreenshot: r02-copied
- tapOn: "Share Invite"
- extendedWaitUntil: { visible: "never-shown-marker", timeout: 2500, optional: true }
- takeScreenshot: r03-share-sheet
- runFlow:                                             # iOS share sheet: swipe it away (no Close button on iOS 26)
    when: { platform: iOS }
    commands:
      - swipe: { start: "50%,62%", end: "50%,99%", duration: 300 }
      - extendedWaitUntil: { visible: "never-shown-marker", timeout: 1200, optional: true }
- runFlow:
    when: { platform: Android }
    commands:
      - back
